[project]
name = "windows"
version = "0.1.0"
description = "Automated Windows QEMU VM management, unattended provisioning, QEMU Guest Agent (QGA) execution, and RemotePath file transfer."
readme = "README.md"
authors = [
    { name = "Gilad Reti", email = "gilad.reti@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "impacket>=0.13.1",
    "pillow>=10.0.0",
    "pycdlib>=1.20.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.76",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nested: marks tests for nested virtualization",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF012"]

